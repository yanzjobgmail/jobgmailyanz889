<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,sans-serif;
}
body{
    background:#0d1117;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.login{
    width:350px;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:10px;
    padding:30px;
}
h2{
    color:white;
    text-align:center;
    margin-bottom:20px;
}
label{
    color:#c9d1d9;
    display:block;
    margin:10px 0 5px;
}
input{
    width:100%;
    padding:10px;
    background:#0d1117;
    border:1px solid #30363d;
    color:white;
    border-radius:6px;
}
button{
    width:100%;
    margin-top:20px;
    padding:10px;
    background:#238636;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
button:hover{
    background:#2ea043;
}
#dashboard{
    display:none;
    color:white;
    text-align:center;
}
</style>
</head>

<body>

<div class="login" id="loginBox">
<h2>Developer Login</h2>

<label>Email</label>
<input type="email" id="email">

<label>Password</label>
<input type="password" id="password">

<button onclick="login()">Sign In</button>
</div>

<div id="dashboard">
<h1>Dashboard</h1>
<p>Login berhasil.</p>
</div>

<script>
function login(){
    let email=document.getElementById("email").value;
    let pass=document.getElementById("password").value;

    if(email==="admin@example.com" && pass==="123456"){
        document.getElementById("loginBox").style.display="none";
        document.getElementById("dashboard").style.display="block";
    }else{
        alert("Email atau password salah");
    }
}
</script>

</body>
</html>
